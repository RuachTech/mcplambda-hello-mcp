# Minimal hello-world MCP server configuration
# Build strategy is auto-detected as "pip" from requirements.txt
run: "python server.py"

# server.py serves MCP over streamable HTTP (mcp.run(transport="http")).
# Without this the platform assumes stdio and the deployment never answers.
transport: "streamable-http"

tools:
  - "echo_tool"

env_vars:
  LOG_LEVEL: "INFO"
